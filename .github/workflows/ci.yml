name: CI

on:
  push:
    branches:
      - main
      - aravind/scanners

  pull_request:
    branches:
      - main

jobs:
  validate-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Project Structure
        run: |
          test -d sast
          test -d pentest
          test -d forecast
          test -d lambda
          test -d terraform
          test -d dashboard
          echo "Project structure valid."

      - name: Pull Node Base Image With Retry
        run: |
          for i in 1 2 3; do
            docker pull node:18-alpine && break
            echo "Docker pull failed. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build SAST Scanner Image
        run: docker build -t sast-scanner:latest ./sast

      - name: Build Pentest Scanner Image
        run: docker build -t pentest-scanner:latest ./pentest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test SAST Scanner
        working-directory: sast/backend
        run: |
          npm install
          npm test

      - name: Test Pentest Scanner
        working-directory: pentest/backend
        run: |
          npm install
          npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push SAST Image to ECR
        run: |
          docker build -t security-forecast-sast-scanner ./sast
          docker tag security-forecast-sast-scanner:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/security-forecast-sast-scanner:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/security-forecast-sast-scanner:latest

      - name: Build and Push Pentest Image to ECR
        run: |
          docker build -t security-forecast-pentest-scanner ./pentest
          docker tag security-forecast-pentest-scanner:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/security-forecast-pentest-scanner:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/security-forecast-pentest-scanner:latest

      - name: CI/CD Complete
        run: echo "CI/CD pipeline passed and scanner images pushed to ECR."
