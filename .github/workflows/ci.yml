name: CI

on:
  push:
    branches:
      - main
      - aravind/scanners

  pull_request:
    branches:
      - main

jobs:
  validate-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Project Structure
        run: |
          test -d sast
          test -d pentest
          test -d forecast
          test -d lambda
          test -d terraform
          test -d dashboard
          echo "Project structure valid."

      - name: Pull Node Base Image With Retry
        run: |
          for i in 1 2 3; do
            docker pull node:18-alpine && break
            echo "Docker pull failed. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build SAST Scanner Image
        run: docker build -t sast-scanner:latest ./sast

      - name: Build Pentest Scanner Image
        run: docker build -t pentest-scanner:latest ./pentest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test SAST Scanner
        working-directory: sast/backend
        run: |
          npm install
          npm test

      - name: Test Pentest Scanner
        working-directory: pentest/backend
        run: |
          npm install
          npm test

      - name: CI Complete
        run: echo "CI pipeline passed successfully."
