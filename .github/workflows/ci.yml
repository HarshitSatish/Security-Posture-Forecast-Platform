name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build SAST Scanner Image
        run: |
          docker build \
            -t sast-scanner:latest \
            ./services/sast-scanner

      - name: Verify Image Exists
        run: |
          docker images
